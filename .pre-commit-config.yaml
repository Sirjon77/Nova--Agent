repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending

  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.5
    hooks:
      - id: ruff
        args: ["--fix"]
        additional_dependencies: []

  # Local hook to keep the flattened codebase snapshot current
  - repo: local
    hooks:
      - id: update-flattened-codebase
        name: Update flattened codebase snapshot
        entry: scripts/update-flattened-codebase.sh
        language: system
        pass_filenames: false
        stages: [commit]

      - id: smoke-tests
        name: Run smoke tests before push
        entry: scripts/test-smoke.sh
        language: system
        pass_filenames: false
        stages: [push]
