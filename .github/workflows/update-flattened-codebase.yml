name: Update Flattened Codebase

on:
  push:
    branches: [ main, to-do-list ]
    paths:
      - '**.py'
      - '**.js'
      - '**.jsx'
      - '**.ts'
      - '**.tsx'
      - '**.json'
      - '**.yaml'
      - '**.yml'
      - '**.md'

jobs:
  update-context:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Update flattened codebase
      run: |
        npx bmad-method@4.39.0 flatten --input . --output docs/flattened-codebase.xml || {
          echo "Warning: Could not update flattened codebase"
          exit 0
        }
        
    - name: Check for changes
      id: check_changes
      run: |
        if git diff --quiet docs/flattened-codebase.xml; then
          echo "changed=false" >> $GITHUB_OUTPUT
        else
          echo "changed=true" >> $GITHUB_OUTPUT
        fi
        
    - name: Commit and push if changed
      if: steps.check_changes.outputs.changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add docs/flattened-codebase.xml
        git commit -m "🔄 Auto-update flattened codebase [skip ci]"
        git push
